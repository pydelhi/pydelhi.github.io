# Builds the site with Eleventy and publishes it to GitHub Pages (pydelhi.org).
# Runs on every push, once a day so new Commudle events show up without a commit, and on demand.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'   # 08:00 IST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # no .cache here, so every build fetches Commudle fresh (lib/commudle-fallback.json covers outages)
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
